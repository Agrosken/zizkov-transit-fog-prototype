<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Žižkov Transit Fog Prototype</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="overlay">
      <div id="stats">
        <div id="distance">0.00 km explored</div>
        <div id="line-count">0 / 0 lines started</div>
      </div>
      <div id="buttons">
        <button id="get-on-btn">Get On</button>
        <button id="extra-btn">Extra ride</button>
        <button id="export-btn">Export</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="picker-backdrop" class="hidden">
      <div id="picker-panel">
        <div id="picker-title"></div>
        <input id="picker-filter" type="text" placeholder="Filter..." />
        <div id="picker-list"></div>
        <button id="picker-cancel">Cancel</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
